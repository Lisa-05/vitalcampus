<!-- Crisis Modal -->
<div id="crisisModal" class="crisis-modal">
    <div class="crisis-modal-content">
        <div class="crisis-modal-header">
            <h2>⚠ Need urgent help?</h2>
            <button class="crisis-close" onclick="closeCrisisModal()">×</button>
        </div>

        <!-- Step 1: University -->
        <div id="crisisStep1">
            <div class="crisis-step-label">Step 1 of 2</div>
            <p style="color: var(--ink-500); font-size: 13px; margin-bottom: 15px;">Which university are you at?</p>

            <button class="crisis-option" onclick="selectUniversity('spu')">
                <div class="crisis-option-icon">🎓</div>
                <div class="crisis-option-text"><strong>Sol Plaatje University (SPU)</strong><span>Kimberley</span></div>
            </button>
            <button class="crisis-option" onclick="selectUniversity('uct')">
                <div class="crisis-option-icon">🎓</div>
                <div class="crisis-option-text"><strong>University of Cape Town (UCT)</strong><span>Cape Town</span></div>
            </button>
            <button class="crisis-option" onclick="selectUniversity('ufs')">
                <div class="crisis-option-icon">🎓</div>
                <div class="crisis-option-text"><strong>University of the Free State (UFS)</strong><span>Bloemfontein</span></div>
            </button>
            <button class="crisis-option" onclick="selectUniversity('up')">
                <div class="crisis-option-icon">🎓</div>
                <div class="crisis-option-text"><strong>University of Pretoria (UP)</strong><span>Pretoria</span></div>
            </button>
            <button class="crisis-option" onclick="selectUniversity('wits')">
                <div class="crisis-option-icon">🎓</div>
                <div class="crisis-option-text"><strong>University of the Witwatersrand (Wits)</strong><span>Johannesburg</span></div>
            </button>
            <button class="crisis-option" onclick="selectUniversity('rhodes')">
                <div class="crisis-option-icon">🎓</div>
                <div class="crisis-option-text"><strong>Rhodes University</strong><span>Makhanda</span></div>
            </button>
            <button class="crisis-option" onclick="selectUniversity('nmu')">
                <div class="crisis-option-icon">🎓</div>
                <div class="crisis-option-text"><strong>Nelson Mandela University (NMU)</strong><span>Port Elizabeth</span></div>
            </button>
            <button class="crisis-option" onclick="selectUniversity('univen')">
                <div class="crisis-option-icon">🎓</div>
                <div class="crisis-option-text"><strong>University of Venda (Univen)</strong><span>Thohoyandou</span></div>
            </button>
            <button class="crisis-option" onclick="selectUniversity('ufh')">
                <div class="crisis-option-icon">🎓</div>
                <div class="crisis-option-text"><strong>University of Fort Hare (UFH)</strong><span>Alice</span></div>
            </button>

            <button class="crisis-back-btn" onclick="selectUniversity('national')">Skip — show national helplines →</button>
        </div>

        <!-- Step 2: Emergency type -->
        <div id="crisisStep2" style="display:none;">
            <div class="crisis-step-label">Step 2 of 2</div>
            <p style="color: var(--ink-500); font-size: 13px; margin-bottom: 15px;">What kind of emergency is it?</p>

            <button class="crisis-option" onclick="showContacts('medical')">
                <div class="crisis-option-icon">🚑</div>
                <div class="crisis-option-text"><strong>Medical emergency</strong><span>Injury, fainting, severe pain</span></div>
            </button>
            <button class="crisis-option" onclick="showContacts('mental')">
                <div class="crisis-option-icon">🧠</div>
                <div class="crisis-option-text"><strong>Mental health crisis</strong><span>Thoughts of self-harm or suicide</span></div>
            </button>
            <button class="crisis-option" onclick="showContacts('safety')">
                <div class="crisis-option-icon">🚨</div>
                <div class="crisis-option-text"><strong>Personal safety</strong><span>Assault, harassment, danger</span></div>
            </button>
            <button class="crisis-option" onclick="showContacts('gbv')">
                <div class="crisis-option-icon">🛡️</div>
                <div class="crisis-option-text"><strong>Gender-based violence</strong><span>GBV support and reporting</span></div>
            </button>

            <button class="crisis-back-btn" onclick="backToStep1()">← Back to university selection</button>
        </div>

        <!-- Step 3: Contacts -->
        <div id="crisisStep3" style="display:none;"></div>
    </div>
</div>

let selectedUniversity = null;

function openCrisisModal() {
    document.getElementById('crisisModal').classList.add('active');
    backToStep1();
}

function closeCrisisModal() {
    document.getElementById('crisisModal').classList.remove('active');
}

function selectUniversity(key) {
    selectedUniversity = key;
    document.getElementById('crisisStep1').style.display = 'none';
    document.getElementById('crisisStep2').style.display = 'block';
    document.getElementById('crisisStep3').style.display = 'none';
}

function showContacts(type) {
    const data = CRISIS_DATA[selectedUniversity];
    if (!data) return;

    const contacts = data[type] || [];
    let html = `
        <div class="crisis-step-label">Emergency contacts</div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <div style="font-size:13px; color: var(--ink-500);">${data.name}</div>
            <button class="crisis-back-btn" style="margin:0; padding:4px 10px; font-size:11px;" onclick="backToStep2()">Change type</button>
        </div>
        <div class="crisis-contact-panel active" style="margin-top:0;">
            <h3>${type === 'medical' ? '🚑 Medical Emergency' : type === 'mental' ? '🧠 Mental Health Crisis' : type === 'safety' ? '🚨 Personal Safety' : '🛡️ Gender-Based Violence'}</h3>
            <p>Tap any number to call directly.</p>
    `;

    contacts.forEach(c => {
        const href = c.isEmail ? `mailto:${c.value}` : `tel:${c.value.replace(/\s/g, '')}`;
        const icon = c.isEmail ? '📧' : '📞';
        html += `
            <a href="${href}" class="contact-line">
                ${icon} ${c.label}: ${c.value}
                ${c.note ? `<small>${c.note}</small>` : ''}
            </a>
        `;
    });

    html += `
            <p style="font-size:11px; color: var(--ink-500); margin-top:15px;">
                If you are in immediate danger, call 10111 (Police) or 10177 (Ambulance).
            </p>
        </div>
        <button class="crisis-back-btn" onclick="backToStep1()">← Start over</button>
    `;

    document.getElementById('crisisStep3').innerHTML = html;
    document.getElementById('crisisStep1').style.display = 'none';
    document.getElementById('crisisStep2').style.display = 'none';
    document.getElementById('crisisStep3').style.display = 'block';
}

function backToStep1() {
    document.getElementById('crisisStep1').style.display = 'block';
    document.getElementById('crisisStep2').style.display = 'none';
    document.getElementById('crisisStep3').style.display = 'none';
    selectedUniversity = null;
}

function backToStep2() {
    document.getElementById('crisisStep1').style.display = 'none';
    document.getElementById('crisisStep2').style.display = 'block';
    document.getElementById('crisisStep3').style.display = 'none';
}

document.getElementById('crisisModal').addEventListener('click', function(e) {
    if (e.target === this) closeCrisisModal();
});
